name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: sahil-f647
      VERCEL_ORG_ID: team_R2qlDB9I1BToj7n6JvKfTmdd
      VERCEL_PROJECT_ID: prj_2w3AfXfiTMyARdGwMzgOh0xVoYxf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'EOF'
          {
            "orgId": "team_R2qlDB9I1BToj7n6JvKfTmdd",
            "projectId": "prj_2w3AfXfiTMyARdGwMzgOh0xVoYxf"
          }
          EOF

      - name: Pull Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        run: npx --yes vercel@latest build --prod --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"